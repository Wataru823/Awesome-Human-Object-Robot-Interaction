<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Human and robot share one object: see, understand, act, learn">
  <defs>
    <marker id="arwBlue" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L11,6 L0,11 z" fill="#2563eb"/>
    </marker>
    <marker id="arwGreen" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L11,6 L0,11 z" fill="#059669"/>
    </marker>
    <marker id="arwViolet" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L11,6 L0,11 z" fill="#7c3aed"/>
    </marker>
    <marker id="arwAmber" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L11,6 L0,11 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="500" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="40" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" fill="#0f172a">The HORI loop</text>
  <text x="40" y="69" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">one object &#183; two actors &#183; four steps</text>

  <!-- ===== HUMAN ===== -->
  <rect x="40" y="90" width="270" height="165" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <circle cx="175" cy="128" r="14" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M160,168 C160,150 190,150 190,168" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <text x="175" y="205" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">HUMAN</text>
  <text x="175" y="231" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#475569">knows how to do the task</text>

  <!-- ===== OBJECT ===== -->
  <rect x="465" y="90" width="270" height="165" rx="16" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <path d="M600,112 L626,126 L626,154 L600,168 L574,154 L574,126 Z" fill="none" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>
  <path d="M574,126 L600,140 L626,126 M600,140 L600,168" fill="none" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>
  <text x="600" y="205" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#92400e">OBJECT</text>
  <text x="600" y="231" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#475569">shape &#183; parts &#183; state &#183; function</text>

  <!-- ===== ROBOT ===== -->
  <rect x="890" y="90" width="270" height="165" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <rect x="1006" y="140" width="38" height="26" rx="5" fill="none" stroke="#059669" stroke-width="3"/>
  <path d="M1012,140 L1012,120 L1044,108" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1012" cy="140" r="3.5" fill="#059669"/>
  <circle cx="1044" cy="108" r="5" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="1025" y="205" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#065f46">ROBOT</text>
  <text x="1025" y="231" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#475569">a different body</text>

  <!-- 1 SEE -->
  <line x1="316" y1="172" x2="456" y2="172" stroke="#2563eb" stroke-width="3" marker-end="url(#arwBlue)"/>
  <text x="386" y="150" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#2563eb">1 &#183; SEE</text>
  <text x="386" y="196" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#475569">hand + object</text>
  <text x="386" y="213" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#475569">in the demo</text>

  <!-- 2 UNDERSTAND -->
  <line x1="600" y1="259" x2="600" y2="292" stroke="#d97706" stroke-width="3" marker-end="url(#arwAmber)"/>
  <rect x="440" y="298" width="320" height="62" rx="12" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
  <text x="600" y="324" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#92400e">2 &#183; UNDERSTAND</text>
  <text x="600" y="345" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#475569">which part is for what (affordance)</text>

  <!-- 3 ACT -->
  <line x1="741" y1="172" x2="884" y2="172" stroke="#059669" stroke-width="3" marker-end="url(#arwGreen)"/>
  <text x="812" y="150" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#059669">3 &#183; ACT</text>
  <text x="812" y="196" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#475569">grasp, move,</text>
  <text x="812" y="213" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#475569">release</text>

  <!-- 4 LEARN (feedback loop) -->
  <path d="M1025,259 L1025,440 L175,440 L175,259" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" marker-end="url(#arwViolet)"/>
  <rect x="470" y="419" width="260" height="42" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="600" y="446" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#6d28d9">4 &#183; LEARN from the outcome</text>

  <text x="600" y="484" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#64748b">Human-Object-Robot Interaction = this loop, with the object in the middle</text>
</svg>
